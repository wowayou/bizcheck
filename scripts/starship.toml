# starship.toml - Starship配置文件
# 放在 ~/.config/starship.toml

# 超时设置（毫秒）
command_timeout = 500

# Prompt格式：[目录][git分支][git状态] $
format = """
$directory\
$git_branch\
$git_status\
$character
"""

# 目录显示
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

# Git分支
[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

# Git状态
[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "⚔️ "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "📦 "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# 命令提示符
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Python虚拟环境（可选，仅在激活venv时显示）
[python]
symbol = "🐍 "
style = "yellow"
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
